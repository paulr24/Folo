<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <style id="mobile-viewport-enforcer">
      html, body, #root {
        width: 100% !important;
        max-width: 100vw !important;
        overflow-x: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
      }
      article {
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: hidden !important;
        box-sizing: border-box !important;
      }
      body *:not(pre):not(pre *):not(code):not(.shiki):not(.shiki *) {
        max-width: 100% !important;
        overflow-x: hidden !important;
        box-sizing: border-box !important;
      }
      pre, .shiki {
        max-width: 100% !important;
        overflow-x: auto !important;
      }
      html body #root article table,
      html body #root table,
      body table {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        table-layout: fixed !important;
        border-collapse: collapse !important;
        box-sizing: border-box !important;
      }
      html body #root article td,
      html body #root article th,
      html body #root td,
      html body #root th,
      body td,
      body th {
        max-width: 100% !important;
        min-width: 0 !important;
        word-break: break-word !important;
        overflow-wrap: anywhere !important;
        white-space: normal !important;
        box-sizing: border-box !important;
      }
      html body #root article div,
      html body #root article p,
      html body #root article span,
      html body #root article center,
      html body #root article section,
      html body #root article a {
        min-width: 0 !important;
        max-width: 100% !important;
        word-break: break-word !important;
        overflow-wrap: anywhere !important;
        box-sizing: border-box !important;
      }
      html body #root img,
      html body #root video,
      html body #root iframe,
      body img,
      body video,
      body iframe {
        max-width: 100% !important;
        height: auto !important;
        box-sizing: border-box !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./src/index.ts" type="module"></script>
  </body>
</html>
